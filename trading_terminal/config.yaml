name: Trading Terminal
version: "0.1.2"
slug: trading_terminal
description: Market data, research and paper/live trading through Alpaca and Interactive Brokers
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Shown in the Home Assistant sidebar, behind Home Assistant's own login
ingress: true
ingress_port: 8501
panel_icon: mdi:chart-line
panel_title: Trading
# Direct access on your network without the Home Assistant login. Off by default; only turn it on
# (set a port in the add-on's Network section) if the sidebar page doesn't load.
ports:
  8501/tcp: null
ports_description:
  8501/tcp: Direct web access (no login; local network only, never forward this port to the internet)
options:
  trading_mode: paper
  watchlist: SPY,QQQ,AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,JPM
  ibkr_enabled: false
  # The IB Gateway add-on from this repository (hostname shown on its Info tab): 4004 = paper, 4003 = live
  ibkr_host: e8950327-ib-gateway
  ibkr_port: 4004
  ibkr_client_id: 17
schema:
  trading_mode: list(paper|live)
  alpaca_paper_api_key: password?
  alpaca_paper_secret_key: password?
  alpaca_live_api_key: password?
  alpaca_live_secret_key: password?
  gemini_api_key: password?
  anthropic_api_key: password?
  finnhub_api_key: password?
  fmp_api_key: password?
  fred_api_key: password?
  sec_contact_email: email?
  watchlist: str
  ibkr_enabled: bool
  ibkr_host: str
  ibkr_port: port?
  ibkr_client_id: int
